[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skookum-mcp"
version = "0.1.0"
description = "A secure, mathematically precise, and self-contained MCP server for physical unit conversion and algebraic dimensional computation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.1.0",
    "pint>=0.22",
    "sympy>=1.12",
]

[project.scripts]
skookum-mcp = "src.server:main"
skookum-dashboard = "src.dashboard.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers --strict-config --cov=src --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "security: tests verifying AST sandboxing and code injection blocks.",
    "conversion: tests verifying unit conversion logic.",
    "length: tests verifying length conversions.",
    "mass: tests verifying mass conversions.",
    "time: tests verifying time conversions.",
    "temperature: tests verifying temperature and affine space constraints.",
    "velocity: tests verifying velocity conversions.",
    "acceleration: tests verifying acceleration conversions.",
    "force: tests verifying force conversions.",
    "pressure: tests verifying pressure and stress conversions.",
    "stress: tests verifying stress conversions.",
    "dimensionless: tests verifying dimensionless ratios, percentages, and angles.",
    "inversion: tests verifying generalized reciprocal inversions.",
    "property: property-based tests verifying algebraic invariants."
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "import",
]
